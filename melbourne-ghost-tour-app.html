        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        
        function startMode(m) {
            state.mode = m;
            state.index = 0;
            state.selected = null;
            state.stats = { correct: 0, incorrect: 0, streak: 0, best: 0 };
            state.history = [];
            
            if (m === 'learn') state.session = [...QUESTIONS];
            else if (m === 'drill') state.session = QUESTIONS.sort(() => Math.random() - 0.5).slice(0, 25);
            else if (m === 'checkpoint') state.session = QUESTIONS.sort(() => Math.random() - 0.5).slice(0, 20);
            else if (m === 'weak') {
                let w = state.history.filter(h => !h.correct).map(h => QUESTIONS.find(q => q.id === h.id)).filter(Boolean);
                state.session = w.length > 0 ? w : QUESTIONS.slice(0, 10);
            }
            
            show('quizScreen');
            next();
        }
        
        function next() {
            if (state.index >= state.session.length) {
                show('resultsScreen');
                let t = state.history.length;
                let c = state.stats.correct;
                document.getElementById('score').textContent = t > 0 ? Math.round(c/t*100) + '%' : '0%';
                document.getElementById('correct').textContent = c;
                document.getElementById('incorrect').textContent = state.stats.incorrect;
                document.getElementById('bestStreak').textContent = state.stats.best;
                update();
                return;
            }
            
            state.selected = null;
            state.answered = false;
            let q = state.session[state.index];
            
            document.getElementById('question').textContent = q.question;
            let h = q.options.map((o, i) => `<div class="option" onclick="pick(${i})">${o}</div>`).join('');
            document.getElementById('options').innerHTML = h;
            document.getElementById('feedback').classList.remove('show', 'correct', 'incorrect');
            document.getElementById('submitBtn').disabled = false;
            
            let p = ((state.index + 1) / state.session.length) * 100;
            document.getElementById('progressBar').style.width = p + '%';
            document.getElementById('progressText').textContent = state.index + 1 + ' / ' + state.session.length;
        }
        
        function pick(i) {
            if (state.answered) return;
            state.selected = i;
            document.querySelectorAll('.option').forEach((o, idx) => {
                o.classList.toggle('active', idx === i);
            });
        }
        
        function submit() {
            if (state.answered || state.selected === null) return;
            state.answered = true;
            
            let q = state.session[state.index];
            let ok = state.selected === q.correct;
            
            if (ok) {
                state.stats.correct++;
                state.stats.streak++;
                state.stats.best = Math.max(state.stats.streak, state.stats.best);
            } else {
                state.stats.incorrect++;
                state.stats.streak = 0;
            }
            
            state.history.push({ id: q.id, correct: ok });
            
            let fb = document.getElementById('feedback');
            fb.textContent = (ok ? '✓ Correct' : '✗ Incorrect') + ' — ' + q.explanation;
            fb.classList.add('show', ok ? 'correct' : 'incorrect');
            
            document.querySelectorAll('.option').forEach((o, i) => {
                o.classList.add('disabled');
                if (i === q.correct) o.classList.add('correct');
                if (i === state.selected && !ok) o.classList.add('incorrect');
            });
            
            update();
            document.getElementById('streak').textContent = state.stats.streak;
            
            setTimeout(() => { state.index++; next(); }, 2000);
        }

            let t = state.history.length;
            let c = state.stats.correct;
            document.getElementById('total').textContent = QUESTIONS.length;
            document.getElementById('answered').textContent = t;
            document.getElementById('accuracy').textContent = t > 0 ? Math.round(c/t*100) + '%' : '0%';
        }
